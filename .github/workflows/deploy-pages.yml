name: Deploy production and test to GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: develop
          path: staging
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble both environments
        run: |
          mkdir -p _site/test
          rsync -a --exclude='.git' --exclude='.github' production/ _site/
          rsync -a --exclude='.git' --exclude='.github' staging/ _site/test/
          test -f _site/index.html
          test -f _site/data/questions.json
          test -f _site/test/index.html
          test -f _site/test/data/questions.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
